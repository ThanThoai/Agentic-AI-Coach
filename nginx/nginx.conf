# Coach Agent — nginx reverse proxy
# Mounted at /etc/nginx/conf.d/default.conf inside the nginx container.
#
# Routes:
#   /api/*          → backend:8000  (SSE buffering disabled)
#   /_next/static/* → frontend:3000 (aggressive cache headers)
#   /*              → frontend:3000 (Next.js SSR)

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

# ── HTTP ─────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Uncomment to redirect to HTTPS once SSL certs are configured:
    # return 301 https://$host$request_uri;

    # ── Health check ─────────────────────────────────────────────────────────
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── API — buffering off for SSE streams ──────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        # Must be off for SSE (RAG / workout / agent streaming endpoints)
        proxy_buffering    off;
        proxy_cache        off;

        proxy_read_timeout    300s;
        proxy_send_timeout    120s;
        proxy_connect_timeout  10s;
    }

    # ── Next.js static assets ─────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js image optimisation ────────────────────────────────────────────
    location /_next/image {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Everything else → Next.js SSR ────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
